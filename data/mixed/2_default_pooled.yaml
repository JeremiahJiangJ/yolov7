# Stock YOLOv7 data loading: all cameras pooled into one dataset. Every image is equally likely, so the largest
# dataset dominates (camA 35k : camB 7k : camC 2k -> ~80% : 16% : 4.5% of samples), mosaic partners come from any
# camera, autoanchor runs on all of them and every image is resized to --img-size.
# Baseline 2 of the experiment ladder, see README.md.
train:
  - /data/camA/images/train
  - /data/camB/images/train
  - /data/camC/images/train
val: /data/camC/images/val   # validation (and best.pt) on the target camera only
nc: 1
names: ['object']
