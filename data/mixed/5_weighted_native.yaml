# Experiment ladder, step 5 of 6 (README.md, section 13): as step 4, plus source weighting.
# Changes from step 4: the weights set each source's training share instead of its frame count. epoch_size: total
# keeps the same samples per epoch as steps 2-4, so the same --epochs is the same training budget.

# --- Classes -----------------------------------------------------------------------------------------------------------
nc: 1
names: ['object']

# --- Defaults for every source -----------------------------------------------------------------------------------------
sampling: weighted
resize: native
fg_crop_prob: 0.5
mosaic_max_cells: 6

# --- Sources -----------------------------------------------------------------------------------------------------------
# weight: training share (relative, normalised): 50 / 30 / 20 = 50% / 30% / 20% of the training samples.
train_sources:
  # Target: exactly one. Its val set drives best.pt / --patience / fitness; autoanchor uses its objects.
  - name: camC
    path: /data/camC/images/train
    val: /data/camC/images/val
    target: true
    weight: 50
  # Supplementary sources. A val path opts in to per-source validation (source_results.txt, TensorBoard
  # metrics_source/<name>/), never used for best.pt; it does not change training.
  - name: camA
    path: /data/camA/images/train
    val: /data/camA/images/val
    weight: 30
  - name: camB
    path: /data/camB/images/train
    weight: 20

# --- Weight schedule (optional, off in the ladder) ---------------------------------------------------------------------
# weight_schedule:
#   mode: linear
#   points:
#     - {progress: 0.6, weights: {camC: 60, camA: 25, camB: 15}}   # progress: fraction of --epochs

# --- Epoch size --------------------------------------------------------------------------------------------------------
# total: as many samples per epoch as frames in all sources, as steps 2-4 (equal budget for the comparison).
# (The default, target, makes --epochs = passes over the target instead.)
epoch_size: total
