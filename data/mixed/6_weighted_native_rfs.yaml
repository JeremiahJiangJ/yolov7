# Experiment ladder, step 6 of 6 (see README.md): as step 5, plus repeat-factor sampling for rare classes.
# Changes from step 5: frames containing classes rarer than repeat_factor_threshold (a fraction of the source's
# frames) are sampled more often, by sqrt(threshold / class frequency), and so are their mosaic partners. Same training
# shares and budget as step 5 (epoch_size: total). Only useful with several, unbalanced classes (with nc: 1 it does
# nothing): run tools/class_audit.py first, and test with test.py --freq-groups to see rare / common / frequent mAP.

# --- Classes -----------------------------------------------------------------------------------------------------------
nc: 1
names: ['object']

# --- Defaults for every source -----------------------------------------------------------------------------------------
sampling: weighted
resize: native
fg_crop_prob: 0.5
mosaic_max_cells: 6
repeat_factor_threshold: 0.01  # classes in fewer than 1% of a source's frames are boosted

# --- Sources -----------------------------------------------------------------------------------------------------------
# weight: training share (relative, normalised): 50 / 30 / 20 = 50% / 30% / 20% of the training samples.
train_sources:
  # Target: exactly one. Its val set drives best.pt / --patience / fitness; autoanchor uses its objects.
  - name: camC
    path: /data/camC/images/train
    val: /data/camC/images/val
    target: true
    weight: 50
  # Supplementary sources. A val path opts in to per-source validation (source_results.txt, TensorBoard
  # metrics_source/<name>/), never used for best.pt; it does not change training.
  - name: camA
    path: /data/camA/images/train
    val: /data/camA/images/val
    weight: 30
  - name: camB
    path: /data/camB/images/train
    weight: 20

# --- Weight schedule (optional, off in the ladder) ---------------------------------------------------------------------
# weight_schedule:
#   mode: linear
#   points:
#     - {progress: 0.6, weights: {camC: 60, camA: 25, camB: 15}}   # progress: fraction of --epochs

# --- Epoch size --------------------------------------------------------------------------------------------------------
# total: as many samples per epoch as frames in all sources, as steps 2-4 (equal budget for the comparison).
# (The default, target, makes --epochs = passes over the target instead.)
epoch_size: total
