# Multi-source training template: target camera C, supplementary cameras A and B.
# Replace the paths, nc and names; everything else has a working default. See data/mixed/README.md.
#
# 1. Check the exposure plan (no training):
#      python -m utils.mixed_data --data data/mixed/template.yaml --epochs 150 --img-size 1280 --close-mosaic 10 \
#        --hyp data/hyp.finetune.sgd.yaml --measure 64
#    --epochs = how many times each camC frame is sampled, as when fine-tuning camC alone. The weights set each source's
#    training share (share of the training samples: pixels and compute); they decide how much camA / camB data is added
#    on top, and so how long training takes. The plan also shows each source's share of the frames loaded and of the
#    objects (add --measure 64): sources with smaller frames put more frames into each mosaic, and object density
#    differs, so those shares can differ a lot from the training share. Adjust the weights if they do.
#    Zoom range: set scale_min / scale_max in the hyp yaml (see data/mixed/README.md, "Scale augmentation").
# 2. Train (crop size = deployment size, here 1280 for camera C):
#      python train.py --weights yolov7-tiny.pt --cfg cfg/training/yolov7-tiny.yaml \
#        --data data/mixed/template.yaml --hyp data/hyp.finetune.sgd.yaml --epochs 150 \
#        --batch-size 16 --img-size 1280 1280 --seed 42 --device 0 --workers 8 \
#        --fitness-metric-weights 0 0 1 0 --close-mosaic 10 --patience 30 \
#        --train-cache-path ./cache/exp1 --test-cache-path ./cache/exp1 \
#        --project runs/mixed --name camC_exp1
# 3. Deploy at the native frame size: python detect.py --weights runs/mixed/camC_exp1/weights/best.pt --img-size 1280 ...

# --- Classes (same for every source) -----------------------------------------------------------------------------------
nc: 1
names: ['object']

# --- Defaults for every source (each can be overridden per source below) -----------------------------------------------
sampling: weighted      # weighted | proportional (every image once per epoch, weights ignored: the unweighted baseline)
resize: native          # native: never resized, objects keep their pixel size | fit: stock YOLOv7 | <factor>, e.g. 0.5
fg_crop_prob: 0.5       # chance a mosaic tile / crop is placed around an object (else at random)
mosaic_max_cells: 6     # max mosaic cells per axis for frames smaller than the tiles; lower if data loading is slow
label_folder: labels    # /dir/images/x.jpg -> /dir/<label_folder>/x.txt

# --- Sources -----------------------------------------------------------------------------------------------------------
# weight: training share (relative, normalised): 30 / 40 / 30 = 30% / 40% / 30% of the training samples.
train_sources:
  # Target: exactly one. Its val set drives best.pt / --patience / fitness; autoanchor uses its objects.
  - name: camC
    path: /data/camC/images/train
    val: /data/camC/images/val
    target: true
    weight: 30

  # Supplementary sources. A val path is optional: if given, the source is validated every epoch (source_results.txt,
  # TensorBoard metrics_source/<name>/) to watch for forgetting, never used for best.pt. Remove it to save time.
  - name: camA
    path: /data/camA/images/train
    val: /data/camA/images/val
    weight: 40

  - name: camB
    path: /data/camB/images/train
    val: /data/camB/images/val
    weight: 30

  # A source whose objects are at a different pixel scale than the target's needs its own resize factor
  # (estimate it from the median box size of comparable objects), e.g.:
  # - name: synthetic
  #   path: /data/synth/images/train
  #   weight: 10
  #   resize: 0.5
  #   label_folder: labels_synth

  # IR camera with both polarities wanted at deployment, and RGB frames as extra data (see README, "IR polarity and
  # grayscale"). inversion_border is required when px_inversion_prob > 0: the black border, in original pixels, that
  # inversion leaves alone (all 0 if none). test.py --invert tests the other polarity.
  # - name: ir
  #   path: /data/ir/images/train
  #   weight: 20
  #   px_inversion_prob: 0.5                                     # chance a training frame is inverted (255 - value)
  #   inversion_border: {top: 12, bottom: 12, left: 8, right: 8}
  # - name: rgb
  #   path: /data/rgb/images/train
  #   weight: 10
  #   to_gray: 1.0                                               # chance a training frame is converted to gray

# --- Weight schedule (optional) -----------------------------------------------------------------------------------------
# The weights above apply from the start. Front-loaded: broad mix first so the large sources are covered, then shift
# towards the target. Keep a floor on the other sources (here 30%) so they are not forgotten late in training.
# progress: fraction of --epochs (the schedule scales with the run length); or use epoch: <n>.
# Every point lists every source. mode: linear ramps from the previous point, step switches at the point.
weight_schedule:
  mode: linear
  points:
    - {progress: 0.6, weights: {camC: 70, camA: 10, camB: 20}}

# --- Epoch size (optional) ----------------------------------------------------------------------------------------------
# target (default): --epochs = passes over the target, whatever the weights and schedule (one epoch is on average one
#   pass over camC plus the other sources' share).
# total: as many samples per epoch as frames in all sources (the budget of a pooled stock run, for equal-budget
#   comparisons). Or an int.
epoch_size: target
