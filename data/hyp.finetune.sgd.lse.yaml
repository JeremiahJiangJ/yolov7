# SGD, finetuning from pretrained weights with local scale canonicalization (README.md, section 14); as hyp.finetune.sgd.yaml plus the lse_* keys
lr0: 0.001  # initial learning rate
lrf: 0.1  # final OneCycleLR learning rate (lr0 * lrf)
momentum: 0.937  # SGD momentum
weight_decay: 0.0005  # optimizer weight decay
warmup_epochs: 1.0  # warmup epochs (fractions ok)
warmup_momentum: 0.8  # warmup initial momentum (SGD only, Adam betas are not warmed up)
warmup_bias_lr: 0.01  # warmup initial bias lr
box: 0.05  # box loss gain
cls: 0.5  # cls loss gain
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 1.0  # obj loss gain (scale with pixels)
obj_pw: 1.0  # obj BCELoss positive_weight
iou_t: 0.20  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold
# anchors: 3  # anchors per output layer (0 to ignore)
fl_gamma: 0.0  # focal loss gamma (efficientDet default gamma=1.5)
hsv_h: 0.015  # image HSV-Hue augmentation (fraction)
hsv_s: 0.7  # image HSV-Saturation augmentation (fraction)
hsv_v: 0.4  # image HSV-Value augmentation (fraction)
degrees: 0.0  # image rotation (+/- deg)
translate: 0.1  # image translation (+/- fraction)
scale: 0.5  # image scale (+/- gain)
# scale_min: 0.8  # native scale: zoom range, log-uniform, replaces scale (see README.md, section 9)
# scale_max: 2.0  # e.g. the largest zoom the deployment camera uses
shear: 0.0  # image shear (+/- deg)
perspective: 0.0  # image perspective (+/- fraction), range 0-0.001
flipud: 0.0  # image flip up-down (probability)
fliplr: 0.5  # image flip left-right (probability)
mosaic: 1.0  # image mosaic (probability)
mixup: 0.05  # image mixup (probability)
copy_paste: 0.0  # image copy paste (probability)
paste_in: 0.05  # image copy paste (probability), use 0 for faster training
loss_ota: 1 # use ComputeLossOTA, use 0 for faster training
# local scale (utils/local_scale.py); defaults apply to keys left out of a hyp file
lse_aug: 0.0  # chance a training image gets a random local-scale warp (labels follow); also for stock models
lse_strength: 0.25  # random warp strength (reference: warping_strength 0.2-0.25); non-separable warps fold above ~0.25
lse_grid: 8  # random warp grid (reference: warping_resolution 8)
lse_separable: 1  # random warps separable (1) or not (0)
lse_canon: 1.0  # canonicalization consistency loss gain (lse models)
lse_equi: 0.0  # objectness equivariance loss gain (lse models); > 0 doubles the training forward
lse_prior: 0.0  # gain of the warps' distance from the identity (lse models)
lse_lr_scale: 1.0  # canonicalizer learning rate / lr0
