# Local scale equivariance, latent mode for yolov7-tiny (README.md, section 14): the image is not warped; the feature
# maps of whole backbone stages are, and are warped back before the stage output is used; the head gets the local scale
# (zero-initialised 1x1 convs), so boxes stay in image pixels. Starts as the identity.
#   python train.py --cfg cfg/training/yolov7-tiny.yaml --lse data/lse/latent_tiny.yaml ...

mode: latent

# Stages run in the canonical frame: [first layer, last layer] of the model yaml (layer indices as printed at start-up).
# A span must be self-contained: its layers only read the span input or earlier layers of the span, and later layers
# only read its last layer (checked at start-up). yolov7-tiny: the three backbone stages ending at the P3 / P4 / P5
# taps (max-pool + ELAN block each). Other models need their own spans.
spans: [[8, 14], [15, 21], [22, 28]]

# --- Warp -------------------------------------------------------------------------------------------------------------
grid: 8
max_zoom: 4.0

# --- Canonicalizer ----------------------------------------------------------------------------------------------------
canon_size: 320
channels: [16, 32, 64]
iters: 4
grad_iters: 2

# --- Losses -----------------------------------------------------------------------------------------------------------
eq_weight: 1.0
eq_strength: 1.0
prior_weight: 0.01
