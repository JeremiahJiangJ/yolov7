# Local scale equivariance: one deep equilibrium canonicalizer (DEC) at the input (README.md, section 14). It warps
# each frame so parts of it are magnified or shrunk; the unchanged detector runs on the warped image; labels are warped
# into it for training and predicted boxes are mapped back to the image. Starts as the identity.
#   python train.py --lse data/lse/input.yaml ...   (test.py / detect.py: nothing to add, the checkpoint keeps it)

# --- Where ------------------------------------------------------------------------------------------------------------
decs: [input]      # input | P1..P6 (closed backbone stages, data/lse/stages.yaml) | P1+..P6+ (open-ended, from that stage
                   # on, data/lse/open.yaml) | [first, last] layer spans. Each entry gets its own canonicalizer. Mixes:
                   # closed stages with each other and with input, e.g. [input, P3, P4, P5]; one open stage with
                   # input only, e.g. [input, P3+].
per_tile: true     # mosaic samples: canonicalize every frame tile on its own (false: the whole sample at once)

# --- Warp -------------------------------------------------------------------------------------------------------------
grid: 8            # knots per axis of the coarse warp grid: 7 x 7 cells, each rescaled on its own
max_zoom: 4.0      # largest ratio between the most magnified and the most shrunk cell of a row / column

# --- Canonicalizer ----------------------------------------------------------------------------------------------------
canon_size: 224    # it sees each frame (tile) resized to canon_size x canon_size
channels: [16, 32, 64]
iters: 4           # fixed-point iterations (phi <- phi + delta(canonical frame))
grad_iters: 2      # last iterations backpropagated
lr_scale: 10.0     # canonicalizer learning rate = lr0 x lr_scale

# --- Losses (added to the detection loss) -----------------------------------------------------------------------------
eq_weight: 1.0     # consistency: a randomly rescaled frame must give the same canonical frame
eq_strength: 1.0   # strength of those random rescalings
eq_regions: 32     # at most this many frames (tiles) per batch in it, at random (it doubles the canonicalizer cost)
size_weight: 0.0   # size target: pull objects towards target_size pixels (sqrt(w * h)) in the canonical frame (labels
target_size: 96    #   needed; at test time the warp is predicted from the image alone). Try 0.1 - 1. Set target_size to
                   #   your median object size: obj_px in lse.txt (the size the detector sees) after one epoch
prior_weight: 0.0  # pull towards the identity warp (only if warps become extreme)

# --- Against the identity basin ---------------------------------------------------------------------------------------
warp_aug: 0.0      # chance a frame of the detector input is randomly rescaled first (labels follow): makes the
warp_aug_strength: 1.0  #   detector robust to warps, so warping stops costing it. Try 0.5
det_grad_epochs: 0 # first epochs where canonicalizers learn from their own losses only, not the detection loss

min_conf: 0.001    # inference: predictions below this objectness are not mapped back; NMS drops them at
                   #   --conf-thres >= min_conf (test.py default 0.001). Lower it only with a lower --conf-thres
