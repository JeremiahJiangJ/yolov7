# Local scale equivariance (LSE), the default placement: latent canonicalization, a canonicalizer at every backbone stage
# P1 - P5, as in the paper (Rahman et al., ICCV 2025, section 4.3). Every setting, with values for objects whose apparent
# size changes as they move towards or away from the camera, on 16:9 frames (e.g. 1920 x 1080) trained at --img-size
# 1280 (README.md, section 14). Used by scripts/train_lse_example.sh. Settings marked ★ first; the rest have sound
# defaults.
#
# How it works: each stage (yolov7-tiny: P1 = layer 0, P2 = 1-7, P3 = 8-14, P4 = 15-21, P5 = 22-28) has its own
# canonicalizer, which looks at the input image and predicts a warp; the stage's input (the image for P1, feature maps
# after) is warped on entry and its output warped back, so the stage runs on canonicalized features while the next stage,
# the neck and the head work in the image frame. The head is told every stage's local magnification (DECScale,
# zero-initialised 1x1 convs). Labels and boxes stay in the image frame: no label warping, no box mapping.
#
# Why latent, not input (data/lse/example_input.yaml, the ablation): the paper finds input canonicalization degrades
# accuracy (segmentation below augmentation, ImageNet below the plain model) while latent canonicalization improves it:
# a monotone grid warp only approximates real local scale change, and warping and unwarping each stage lets the layers
# after it absorb the approximation's errors, where warping the input imposes them (and the detail lost where it shrinks)
# on the whole detector. Costs: five canonicalizers (~1.4x the step of input canonicalization at canon_size [126, 224]
# on CPU, batch 8), five solves at inference, and each stage's warp in / warp back resamples feature maps.
#
# Architecture settings (decs, grid, max_zoom, canon_size, channels, iters, grad_iters) are shared by the five
# canonicalizers, fixed once a run starts and stored in the checkpoint. The others are training settings.
#
# What to watch while training, per canonicalizer P1/ ... P5/ (lse.txt, TensorBoard lse/*, --lse-debug's
# lse_debug/status.txt + triplets):
#   - verdict ok, zoom_in / zoom_out above 1, disp above 0: the warps left the identity (else: identity basin, below)
#   - step small: the fixed-point solve converges in `iters` iterations
#   - <dec>/obj_px moving towards target_size: the size target works
#   - <dec>/scale_r rising towards 1: the warp magnifies small objects and shrinks large ones (0: it ignores scale)

# --- Where ------------------------------------------------------------------------------------------------------------
decs: [P1, P2, P3, P4, P5]  # ★ one closed canonicalizer per backbone stage. Subsets work too, e.g. [P3, P4, P5] (the
                       #   stages feeding the neck; cheaper, no stride-2 / -4 feature resampling). [input]: the ablation,
                       #   data/lse/example_input.yaml
per_tile: true         # mosaic samples: canonicalize every frame tile on its own (a warp assumes one scene); also makes
                       #   the regions the letterbox content (not the grey bars), in training and at inference

# --- Warp -------------------------------------------------------------------------------------------------------------
grid: 8                # ★ knots per axis: (grid - 1)^2 cells, each rescaled on its own; at 1280, 8 -> ~180 px cells.
                       #   Objects about a cell apart get independent zooms. Check with your labels:
                       #   python tools/grid_capacity.py --data <data.yaml> --img-size 1280 --target-size <obj_px>
                       #   Try 12 for dense scenes (with a larger canon_size)
max_zoom: 2.5          # ★ largest magnified / shrunk ratio within a row (column). Shrunk regions lose detail in the
                       #   warped feature maps; 2 - 2.5 is a good range (4 is the code default)

# --- Canonicalizer (the small network that predicts the warp) ---------------------------------------------------------
canon_size: [126, 224] # ★ each canonicalizer's view of a region ([height, width], 16:9 here). Five canonicalizers make
                       #   this the main cost: at [126, 224] the step is ~1.4x that of input canonicalization at the
                       #   same size; [252, 448] sees smaller objects (~25 instead of ~50 px at 1280) at ~2x this cost
channels: [16, 32, 64] # conv widths (stride 2 each)
iters: 4               # fixed-point iterations: phi <- phi + delta(canonical view). Raise (6 - 8) if `step` stays large
grad_iters: 2          # of which the last ones are backpropagated (truncated deep-equilibrium gradient)
lr_scale: 10.0         # ★ canonicalizer learning rate = lr0 x lr_scale. It starts at zero (identity warp) and must move
                       #   faster than the fine-tuned detector: 10 - 30. 0 freezes it (the warp-augmentation control)
checkpoint: true       # recompute canonicalizer / warp activations in backward instead of storing them: same gradients,
                       #   ~20x less extra memory, ~5 - 20% more step time. Keep on
antialias: true        # image warps blur before they shrink (no aliasing in shrunk regions). Keep on

# --- Losses (added to the detection loss) -----------------------------------------------------------------------------
eq_weight: 1.0         # consistency: a randomly rescaled region must give the same canonical view (defines a canonical
                       #   form; the identity does not minimise it). It needs a second solve: the costly part of training
eq_strength: 1.0       # strength of those random rescalings (1.0: strongest local zoom ~1.5x at max_zoom 2.5, ~1.9x
                       #   at 4)
eq_regions: 8          # ★ regions per batch in each canonicalizer's consistency loss (five second solves): 8 keeps it
                       #   cheap with mosaic tiles; with single frames a batch has only batch-size regions anyway
eq_area: true          # weight it by the image area each canonical pixel shows (shrinking detail cannot lower it)
size_weight: 0.5       # ★ size target: pull every object towards target_size pixels in the canonical frame, the canonical
                       #   form "objects at one size" this use case wants. Labels define it in training; at test time the
                       #   warp still comes from the image alone. 0.1 - 1; 0 turns it off
target_size: 64        # ★ the size it pulls towards, sqrt(w * h) in pixels at --img-size. Set it to your median object
                       #   size (obj_px in lse.txt after one epoch) or near the geometric mean of your anchors
prior_weight: 0.0      # pull towards the identity warp: only if warps become extreme (verdict saturated)

# --- Against the identity basin (a detector pretrained on unwarped images resists any warp) ---------------------------
warp_aug: 0.5          # ★ chance a region of the detector input is randomly rescaled first (labels follow): the detector
                       #   becomes robust to warps, so warping stops costing it. Main remedy if the verdict is STUCK
warp_aug_strength: 1.0 #   strength of those rescalings (1.0: strongest local zoom ~1.5x at max_zoom 2.5; 0.5: ~1.25x)
det_grad_epochs: 2     # ★ first epochs in which canonicalizers learn from their own losses only (consistency, size), not
                       #   from the detection loss, which pulls them back to the identity at first

# --- Anchors ----------------------------------------------------------------------------------------------------------
reanchor_epoch: -1     # closed stages leave the labels in the image frame, so the anchors see the usual sizes: the fit
                       #   (anchor_bpr) is logged anyway; re-fitting is rarely needed here

# --- Inference --------------------------------------------------------------------------------------------------------
min_conf: 0.001        # unused here (closed stages: boxes are predicted in the image frame, nothing is mapped back)
