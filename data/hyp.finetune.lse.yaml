# SGD fine-tuning with local scale equivariance (--lse), stage 2 (README.md, section 14): hyp.finetune.sgd.yaml without
# the augmentations that mix scenes (mosaic, mixup, copy-paste, paste-in), so each sample is a single frame, as when
# the canonicalizers are used. Train stage 1 without --lse first (all augmentations), then fine-tune from it with this.
# For no augmentation at all, also set hsv_* , translate, scale and fliplr to 0.
lr0: 0.001  # initial learning rate
lrf: 0.1  # final OneCycleLR learning rate (lr0 * lrf)
momentum: 0.937  # SGD momentum
weight_decay: 0.0005  # optimizer weight decay
warmup_epochs: 1.0  # warmup epochs (fractions ok)
warmup_momentum: 0.8  # warmup initial momentum (SGD only, Adam betas are not warmed up)
warmup_bias_lr: 0.01  # warmup initial bias lr
box: 0.05  # box loss gain
cls: 0.5  # cls loss gain
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 1.0  # obj loss gain (scale with pixels)
obj_pw: 1.0  # obj BCELoss positive_weight
iou_t: 0.20  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold
fl_gamma: 0.0  # focal loss gamma (efficientDet default gamma=1.5)
hsv_h: 0.015  # image HSV-Hue augmentation (fraction)
hsv_s: 0.7  # image HSV-Saturation augmentation (fraction)
hsv_v: 0.4  # image HSV-Value augmentation (fraction)
degrees: 0.0  # image rotation (+/- deg): keep 0 with LSE (frame tiles stay rectangles)
translate: 0.1  # image translation (+/- fraction)
scale: 0.5  # image scale (+/- gain)
shear: 0.0  # image shear (+/- deg): keep 0 with LSE
perspective: 0.0  # image perspective (+/- fraction): keep 0 with LSE
flipud: 0.0  # image flip up-down (probability)
fliplr: 0.5  # image flip left-right (probability)
mosaic: 0.0  # image mosaic (probability)
mixup: 0.0  # image mixup (probability)
copy_paste: 0.0  # image copy paste (probability)
paste_in: 0.0  # image copy paste (probability), use 0 for faster training
loss_ota: 1 # use ComputeLossOTA, use 0 for faster training
