# yolov7-tiny-dec-p345: yolov7-tiny with deep equilibrium canonicalizer (DEC) layers (README.md, section 14).
# Closed P3, P4 and P5 DECs: each stage runs in its own canonical frame and is warped back; the
# head is told the local scales (DECScale).
#   python train.py --cfg cfg/training/dec/yolov7-tiny-dec-p345.yaml --weights yolov7-tiny.pt ...
# (no --lse: the DEC layers are part of this architecture; the plain layers load the plain weights).
# dec: holds the training settings (losses, warp augmentation, learning rate; explained in data/lse/input.yaml).
# DEC layer arguments: [name, grid, max_zoom, canon_size, channels, iters, grad_iters]. Generated with
#   python -m models.dec --cfg cfg/training/yolov7-tiny.yaml --lse data/lse/stages.yaml --out <this file>

nc: 80
depth_multiple: 1.0
width_multiple: 1.0
anchors: [[10, 13, 16, 30, 33, 23], [30, 61, 62, 45, 59, 119], [116, 90, 156, 198, 373, 326]]

dec:  # training settings of the DEC layers (utils/lse.py DEFAULTS, data/lse/input.yaml)
  decs: ["P3", "P4", "P5"]
  per_tile: true
  eq_weight: 1.0
  eq_strength: 1.0
  eq_regions: 32
  size_weight: 0.0
  target_size: 96
  prior_weight: 0.0
  warp_aug: 0.0
  warp_aug_strength: 1.0
  det_grad_epochs: 0
  lr_scale: 10.0
  min_conf: 0.001

backbone:
  [[-1, 1, DECInput, []],  # 0: the input image
   [0, 1, DEC, [P3, 8, 4.0, 224, [16, 32, 64], 4, 2]],  # 1: canonicalizer P3: looks at the detector input
   [0, 1, DEC, [P4, 8, 4.0, 224, [16, 32, 64], 4, 2]],  # 2: canonicalizer P4: looks at the detector input
   [0, 1, DEC, [P5, 8, 4.0, 224, [16, 32, 64], 4, 2]],  # 3: canonicalizer P5: looks at the detector input
   [0, 1, Conv, [32, 3, 2, None, 1, nn.LeakyReLU(0.1)]],  # 4: plain layer 0
   [4, 1, Conv, [64, 3, 2, None, 1, nn.LeakyReLU(0.1)]],  # 5: plain layer 1
   [5, 1, Conv, [32, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 6: plain layer 2
   [5, 1, Conv, [32, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 7: plain layer 3
   [7, 1, Conv, [32, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 8: plain layer 4
   [8, 1, Conv, [32, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 9: plain layer 5
   [[9, 8, 7, 6], 1, Concat, [1]],  # 10: plain layer 6
   [10, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 11: plain layer 7
   [[11, 1], 1, DECWarp, []],  # 12: into P3: layer 11 warped
   [12, 1, MP, []],  # 13: plain layer 8 (in P3)
   [13, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 14: plain layer 9 (in P3)
   [13, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 15: plain layer 10 (in P3)
   [15, 1, Conv, [64, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 16: plain layer 11 (in P3)
   [16, 1, Conv, [64, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 17: plain layer 12 (in P3)
   [[17, 16, 15, 14], 1, Concat, [1]],  # 18: plain layer 13 (in P3)
   [18, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 19: plain layer 14 (in P3)
   [[19, 1], 1, DECUnwarp, []],  # 20: end of P3: layer 19 warped back
   [[20, 2], 1, DECWarp, []],  # 21: into P4: layer 20 warped
   [21, 1, MP, []],  # 22: plain layer 15 (in P4)
   [22, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 23: plain layer 16 (in P4)
   [22, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 24: plain layer 17 (in P4)
   [24, 1, Conv, [128, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 25: plain layer 18 (in P4)
   [25, 1, Conv, [128, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 26: plain layer 19 (in P4)
   [[26, 25, 24, 23], 1, Concat, [1]],  # 27: plain layer 20 (in P4)
   [27, 1, Conv, [256, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 28: plain layer 21 (in P4)
   [[28, 2], 1, DECUnwarp, []],  # 29: end of P4: layer 28 warped back
   [[29, 3], 1, DECWarp, []],  # 30: into P5: layer 29 warped
   [30, 1, MP, []],  # 31: plain layer 22 (in P5)
   [31, 1, Conv, [256, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 32: plain layer 23 (in P5)
   [31, 1, Conv, [256, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 33: plain layer 24 (in P5)
   [33, 1, Conv, [256, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 34: plain layer 25 (in P5)
   [34, 1, Conv, [256, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 35: plain layer 26 (in P5)
   [[35, 34, 33, 32], 1, Concat, [1]],  # 36: plain layer 27 (in P5)
   [36, 1, Conv, [512, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 37: plain layer 28 (in P5)
   [[37, 3], 1, DECUnwarp, []]]  # 38: end of P5: layer 37 warped back

head:
  [[38, 1, Conv, [256, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 39: plain layer 29
   [38, 1, Conv, [256, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 40: plain layer 30
   [40, 1, SP, [5]],  # 41: plain layer 31
   [40, 1, SP, [9]],  # 42: plain layer 32
   [40, 1, SP, [13]],  # 43: plain layer 33
   [[43, 42, 41, 40], 1, Concat, [1]],  # 44: plain layer 34
   [44, 1, Conv, [256, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 45: plain layer 35
   [[45, 39], 1, Concat, [1]],  # 46: plain layer 36
   [46, 1, Conv, [256, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 47: plain layer 37
   [47, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 48: plain layer 38
   [48, 1, nn.Upsample, [None, 2, nearest]],  # 49: plain layer 39
   [29, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 50: plain layer 40
   [[50, 49], 1, Concat, [1]],  # 51: plain layer 41
   [51, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 52: plain layer 42
   [51, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 53: plain layer 43
   [53, 1, Conv, [64, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 54: plain layer 44
   [54, 1, Conv, [64, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 55: plain layer 45
   [[55, 54, 53, 52], 1, Concat, [1]],  # 56: plain layer 46
   [56, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 57: plain layer 47
   [57, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 58: plain layer 48
   [58, 1, nn.Upsample, [None, 2, nearest]],  # 59: plain layer 49
   [20, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 60: plain layer 50
   [[60, 59], 1, Concat, [1]],  # 61: plain layer 51
   [61, 1, Conv, [32, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 62: plain layer 52
   [61, 1, Conv, [32, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 63: plain layer 53
   [63, 1, Conv, [32, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 64: plain layer 54
   [64, 1, Conv, [32, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 65: plain layer 55
   [[65, 64, 63, 62], 1, Concat, [1]],  # 66: plain layer 56
   [66, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 67: plain layer 57
   [67, 1, Conv, [128, 3, 2, None, 1, nn.LeakyReLU(0.1)]],  # 68: plain layer 58
   [[68, 57], 1, Concat, [1]],  # 69: plain layer 59
   [69, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 70: plain layer 60
   [69, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 71: plain layer 61
   [71, 1, Conv, [64, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 72: plain layer 62
   [72, 1, Conv, [64, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 73: plain layer 63
   [[73, 72, 71, 70], 1, Concat, [1]],  # 74: plain layer 64
   [74, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 75: plain layer 65
   [75, 1, Conv, [256, 3, 2, None, 1, nn.LeakyReLU(0.1)]],  # 76: plain layer 66
   [[76, 47], 1, Concat, [1]],  # 77: plain layer 67
   [77, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 78: plain layer 68
   [77, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 79: plain layer 69
   [79, 1, Conv, [128, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 80: plain layer 70
   [80, 1, Conv, [128, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 81: plain layer 71
   [[81, 80, 79, 78], 1, Concat, [1]],  # 82: plain layer 72
   [82, 1, Conv, [256, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 83: plain layer 73
   [67, 1, Conv, [128, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 84: plain layer 74
   [75, 1, Conv, [256, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 85: plain layer 75
   [83, 1, Conv, [512, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 86: plain layer 76
   [[84, 1, 2, 3], 1, DECScale, []],  # 87: head input 84 + local scale of ['P3', 'P4', 'P5']
   [[85, 1, 2, 3], 1, DECScale, []],  # 88: head input 85 + local scale of ['P3', 'P4', 'P5']
   [[86, 1, 2, 3], 1, DECScale, []],  # 89: head input 86 + local scale of ['P3', 'P4', 'P5']
   [[87, 88, 89], 1, IDetect, [nc, anchors]]]  # 90: plain layer 77
