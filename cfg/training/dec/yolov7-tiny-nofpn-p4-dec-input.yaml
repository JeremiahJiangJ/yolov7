# yolov7-tiny-nofpn-p4-dec-input: yolov7-tiny-nofpn-p4 with deep equilibrium canonicalizer (DEC) layers (README.md, section 14).
# An input DEC on yolov7-tiny without the feature pyramid (one stride-16 detection level): the
# canonicalizer takes over the pyramid's job of handling object scale.
#   python train.py --cfg cfg/training/dec/yolov7-tiny-nofpn-p4-dec-input.yaml --weights yolov7-tiny.pt ...
# (no --lse: the DEC layers are part of this architecture; the plain layers load the plain weights).
# dec: holds the training settings (losses, warp augmentation, learning rate; explained in data/lse/input.yaml).
# DEC layer arguments: [name, grid, max_zoom, canon_size, channels, iters, grad_iters]. Generated with
#   python -m models.dec --cfg cfg/training/yolov7-tiny-nofpn-p4.yaml --lse data/lse/input.yaml --out <this file>

nc: 80
depth_multiple: 1.0
width_multiple: 1.0
anchors: [[30, 61, 62, 45, 59, 119]]

dec:  # training settings of the DEC layers (utils/lse.py DEFAULTS, data/lse/input.yaml)
  decs: ["input"]
  per_tile: true
  eq_weight: 1.0
  eq_strength: 1.0
  eq_regions: 32
  size_weight: 0.0
  target_size: 96
  prior_weight: 0.0
  warp_aug: 0.0
  warp_aug_strength: 1.0
  det_grad_epochs: 0
  lr_scale: 10.0
  min_conf: 0.001

backbone:
  [[-1, 1, DECInput, []],  # 0: the input image
   [0, 1, DEC, [input, 8, 4.0, 224, [16, 32, 64], 4, 2]],  # 1: canonicalizer input: warps of the image
   [[0, 1], 1, DECWarp, []],  # 2: the canonical image: the detector input
   [2, 1, Conv, [32, 3, 2, None, 1, nn.LeakyReLU(0.1)]],  # 3: plain layer 0
   [3, 1, Conv, [64, 3, 2, None, 1, nn.LeakyReLU(0.1)]],  # 4: plain layer 1
   [4, 1, Conv, [32, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 5: plain layer 2
   [4, 1, Conv, [32, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 6: plain layer 3
   [6, 1, Conv, [32, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 7: plain layer 4
   [7, 1, Conv, [32, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 8: plain layer 5
   [[8, 7, 6, 5], 1, Concat, [1]],  # 9: plain layer 6
   [9, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 10: plain layer 7
   [10, 1, MP, []],  # 11: plain layer 8
   [11, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 12: plain layer 9
   [11, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 13: plain layer 10
   [13, 1, Conv, [64, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 14: plain layer 11
   [14, 1, Conv, [64, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 15: plain layer 12
   [[15, 14, 13, 12], 1, Concat, [1]],  # 16: plain layer 13
   [16, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 17: plain layer 14
   [17, 1, MP, []],  # 18: plain layer 15
   [18, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 19: plain layer 16
   [18, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 20: plain layer 17
   [20, 1, Conv, [128, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 21: plain layer 18
   [21, 1, Conv, [128, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 22: plain layer 19
   [[22, 21, 20, 19], 1, Concat, [1]],  # 23: plain layer 20
   [23, 1, Conv, [256, 1, 1, None, 1, nn.LeakyReLU(0.1)]]]  # 24: plain layer 21

head:
  [[24, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 25: plain layer 22
   [24, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 26: plain layer 23
   [26, 1, SP, [5]],  # 27: plain layer 24
   [26, 1, SP, [9]],  # 28: plain layer 25
   [26, 1, SP, [13]],  # 29: plain layer 26
   [[29, 28, 27, 26], 1, Concat, [1]],  # 30: plain layer 27
   [30, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 31: plain layer 28
   [[31, 25], 1, Concat, [1]],  # 32: plain layer 29
   [32, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 33: plain layer 30
   [33, 1, Conv, [256, 3, 1, None, 1, nn.LeakyReLU(0.1)]],  # 34: plain layer 31
   [[34], 1, IDetect, [nc, anchors]]]  # 35: plain layer 32
