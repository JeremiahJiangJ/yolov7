   [67, 1, nn.Upsample, [None, 2, nearest]],  # 68: plain layer 65
   [27, 1, Conv, [128, 1, 1]],  # 69: plain layer 66
   [[69, 68], 1, Concat, [1]],  # 70: plain layer 67
   [70, 1, Conv, [128, 1, 1]],  # 71: plain layer 68
   [70, 1, Conv, [128, 1, 1]],  # 72: plain layer 69
   [72, 1, Conv, [64, 3, 1]],  # 73: plain layer 70
