   [78, 1, Conv, [128, 1, 1]],  # 81: plain layer 78
   [81, 1, Conv, [128, 3, 2]],  # 82: plain layer 79
   [[82, 80, 66], 1, Concat, [1]],  # 83: plain layer 80
