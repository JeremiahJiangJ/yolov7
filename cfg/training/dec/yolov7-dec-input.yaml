# yolov7-dec-input: yolov7 with deep equilibrium canonicalizer (DEC) layers (README.md, section 14).
# An input DEC: the unchanged yolov7 runs on the canonical (locally rescaled) image.
#   python train.py --cfg cfg/training/dec/yolov7-dec-input.yaml --weights yolov7.pt ...
# (no --lse: the DEC layers are part of this architecture; the plain layers load the plain weights).
# dec: holds the training settings (losses, warp augmentation, learning rate; explained in data/lse/input.yaml).
# DEC layer arguments: [name, grid, max_zoom, canon_size, channels, iters, grad_iters]. Generated with
#   python -m models.dec --cfg cfg/training/yolov7.yaml --lse data/lse/input.yaml --out <this file>

nc: 80
depth_multiple: 1.0
width_multiple: 1.0
anchors: [[12, 16, 19, 36, 40, 28], [36, 75, 76, 55, 72, 146], [142, 110, 192, 243, 459, 401]]

dec:  # training settings of the DEC layers (utils/lse.py DEFAULTS, data/lse/input.yaml)
  decs: ["input"]
  per_tile: true
  eq_weight: 1.0
  eq_strength: 1.0
  eq_regions: 32
  size_weight: 0.0
  target_size: 96
  prior_weight: 0.0
  warp_aug: 0.0
  warp_aug_strength: 1.0
  det_grad_epochs: 0
  lr_scale: 10.0
  min_conf: 0.001

backbone:
  [[-1, 1, DECInput, []],  # 0: the input image
   [0, 1, DEC, [input, 8, 4.0, 224, [16, 32, 64], 4, 2]],  # 1: canonicalizer input: warps of the image
   [[0, 1], 1, DECWarp, []],  # 2: the canonical image: the detector input
   [2, 1, Conv, [32, 3, 1]],  # 3: plain layer 0
   [3, 1, Conv, [64, 3, 2]],  # 4: plain layer 1
   [4, 1, Conv, [64, 3, 1]],  # 5: plain layer 2
   [5, 1, Conv, [128, 3, 2]],  # 6: plain layer 3
   [6, 1, Conv, [64, 1, 1]],  # 7: plain layer 4
   [6, 1, Conv, [64, 1, 1]],  # 8: plain layer 5
   [8, 1, Conv, [64, 3, 1]],  # 9: plain layer 6
   [9, 1, Conv, [64, 3, 1]],  # 10: plain layer 7
   [10, 1, Conv, [64, 3, 1]],  # 11: plain layer 8
   [11, 1, Conv, [64, 3, 1]],  # 12: plain layer 9
   [[12, 10, 8, 7], 1, Concat, [1]],  # 13: plain layer 10
   [13, 1, Conv, [256, 1, 1]],  # 14: plain layer 11
   [14, 1, MP, []],  # 15: plain layer 12
   [15, 1, Conv, [128, 1, 1]],  # 16: plain layer 13
   [14, 1, Conv, [128, 1, 1]],  # 17: plain layer 14
   [17, 1, Conv, [128, 3, 2]],  # 18: plain layer 15
   [[18, 16], 1, Concat, [1]],  # 19: plain layer 16
   [19, 1, Conv, [128, 1, 1]],  # 20: plain layer 17
   [19, 1, Conv, [128, 1, 1]],  # 21: plain layer 18
