   [74, 1, Conv, [64, 3, 1]],  # 75: plain layer 72
   [75, 1, Conv, [64, 3, 1]],  # 76: plain layer 73
   [[76, 75, 74, 73, 72, 71], 1, Concat, [1]],  # 77: plain layer 74
   [77, 1, Conv, [128, 1, 1]],  # 78: plain layer 75
   [78, 1, MP, []],  # 79: plain layer 76
