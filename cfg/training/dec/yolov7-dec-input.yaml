   [24, 1, Conv, [128, 3, 1]],  # 25: plain layer 22
   [[25, 23, 21, 20], 1, Concat, [1]],  # 26: plain layer 23
   [26, 1, Conv, [512, 1, 1]],  # 27: plain layer 24
   [27, 1, MP, []],  # 28: plain layer 25
   [28, 1, Conv, [256, 1, 1]],  # 29: plain layer 26
   [27, 1, Conv, [256, 1, 1]],  # 30: plain layer 27
